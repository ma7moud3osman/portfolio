<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>لوحة التحكم - تعديل مشروع</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EEF0F3}
a{color:#2449D8;text-decoration:none}
input,select,textarea{font:inherit;color:#16202B}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #2449D8;outline-offset:2px}
</style>
</helmet>
<div dir="rtl" style="font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #16202B; background: #EEF0F3; min-height: 100vh; display: flex; flex-direction: column">

  <header style="background: #FFFFFF; border-bottom: 1px solid #D8DCE2; padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px">
    <span style="font-weight: 700; font-size: 17px">لوحة تحكم البورتفوليو</span>
    <nav aria-label="مسار الصفحة" style="display: flex; gap: 8px; align-items: center; font-size: 14px; color: #56616E; flex-grow: 1">
      <a href="#" style="color: #56616E">المشاريع</a>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      <span aria-current="page" style="color: #16202B">Ranisy Logistics</span>
    </nav>
    <div style="display: flex; gap: 8px; align-items: center">
      <button type="button" aria-label="مزيد من الإجراءات" style="width: 40px; height: 40px; border: 1px solid #D8DCE2; background: #FFFFFF; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
      </button>
      <button type="button" style="height: 40px; padding: 0 18px; border: 1px solid #D8DCE2; background: #FFFFFF; border-radius: 8px; font: inherit; font-size: 14px; cursor: pointer">معاينة</button>
      <button type="button" style="height: 40px; padding: 0 20px; border: 0; background: #2449D8; color: #FFFFFF; border-radius: 8px; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">نشر التعديلات</button>
    </div>
  </header>

  <div style="display: flex; flex-wrap: wrap; flex-grow: 1">
    <nav aria-label="أقسام المحتوى" style="flex: 1 1 220px; max-width: 260px; background: #FFFFFF; border-left: 1px solid #D8DCE2; padding: 20px 12px; display: flex; flex-direction: column; gap: 4px; font-size: 15px">
      <a href="#" aria-current="page" style="padding: 10px 14px; border-radius: 8px; background: #EEF2FD; color: #16309A; font-weight: 500">المشاريع</a>
      <a href="#" style="padding: 10px 14px; border-radius: 8px; color: #16202B">الملف الشخصي</a>
      <a href="#" style="padding: 10px 14px; border-radius: 8px; color: #16202B">الخبرات</a>
      <a href="#" style="padding: 10px 14px; border-radius: 8px; color: #16202B">الشهادات والمهارات</a>
      <a href="#" style="padding: 10px 14px; border-radius: 8px; color: #16202B">الروابط والسيرة الذاتية</a>
      <a href="#" style="padding: 10px 14px; border-radius: 8px; color: #16202B">الصور والملفات</a>
    </nav>

    <main style="flex: 999 1 560px; min-width: 0; padding: 24px; display: flex; flex-direction: column; gap: 16px">
      <section style="background: #FFFFFF; border: 1px solid #D8DCE2; border-radius: 12px; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px">
        <h2 style="margin: 0; font-size: 17px; font-weight: 700">بيانات المشروع</h2>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px">
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">الاسم بالعربية<input value="رانيسي للخدمات اللوجستية" style="height: 40px; padding: 0 12px; border: 1px solid #C9CED6; border-radius: 8px"></label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">الاسم بالإنجليزية<input dir="ltr" value="Ranisy Logistics" style="height: 40px; padding: 0 12px; border: 1px solid #C9CED6; border-radius: 8px; text-align: left"></label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">الشركة<input value="GAIT" style="height: 40px; padding: 0 12px; border: 1px solid #C9CED6; border-radius: 8px"></label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">الحالة<select style="height: 40px; padding: 0 10px; border: 1px solid #C9CED6; border-radius: 8px; background: #FFFFFF"><option>منشور على المتاجر</option><option>قيد التطوير</option><option>مخفي</option></select></label>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px">
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">الوصف المختصر بالعربية<textarea rows="2" style="padding: 10px 12px; border: 1px solid #C9CED6; border-radius: 8px; resize: vertical">منصة تجمع التخليص الجمركي وإدارة النقل والتوصيل في تطبيق واحد.</textarea></label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">الوصف المختصر بالإنجليزية<textarea dir="ltr" rows="2" style="padding: 10px 12px; border: 1px solid #C9CED6; border-radius: 8px; resize: vertical; text-align: left">Customs clearance, transport management and live shipment tracking in one app.</textarea></label>
        </div>
      </section>

      <section style="background: #FFFFFF; border: 1px solid #D8DCE2; border-radius: 12px; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px">
        <h2 style="margin: 0; font-size: 17px; font-weight: 700">الروابط والصور</h2>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px">
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">رابط Google Play<input dir="ltr" value="play.google.com/store/apps/details?id=com.ghanemtech.ranisy_logistics" style="height: 40px; padding: 0 12px; border: 1px solid #C9CED6; border-radius: 8px; text-align: left"></label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">رابط App Store<input dir="ltr" value="apps.apple.com/eg/app/ranisy/id6752961630" style="height: 40px; padding: 0 12px; border: 1px solid #C9CED6; border-radius: 8px; text-align: left"></label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">رابط GitHub أو pub.dev<input dir="ltr" value="" style="height: 40px; padding: 0 12px; border: 1px solid #C9CED6; border-radius: 8px; text-align: left"></label>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
          <div style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">
            الأيقونة
            <img src="/_blob/acb13b1785673e44adc10a1d005868f4" alt="أيقونة المشروع الحالية" style="width: 88px; height: 88px; border-radius: 20px; object-fit: cover">
          </div>
          <div style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500; flex: 1 1 400px">
            صور الشاشات
            <div style="display: flex; gap: 12px; flex-wrap: wrap; align-items: center">
              <img src="/_blob/ee0ea38d34ea549d55710213ca963cc3" alt="صورة شاشة 1" style="height: 140px; border-radius: 10px">
              <img src="/_blob/b0db2f9ccf65a5c096e642b8473f4e39" alt="صورة شاشة 2" style="height: 140px; border-radius: 10px">
              <img src="/_blob/eb99df01cbd3b78c24c0a55f2c212266" alt="صورة شاشة 3" style="height: 140px; border-radius: 10px">
              <button type="button" style="height: 140px; width: 96px; border: 1.5px dashed #9AA3AF; background: #F7F8FA; border-radius: 10px; font: inherit; font-size: 14px; color: #3C4652; cursor: pointer">رفع صورة</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
